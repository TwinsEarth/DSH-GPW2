# Bundle patch for DSH-GPW2 (Global Permission Watchdog, standalone).
#
# **Distinct from the DSH-GPW that ships inside @twinsearth/w2m-dsh-plugin**: that one mounts at id `dsh-gpw`, this
# one at `dsh-gpw2`, and the plugin's own `name` export differs too. A shared id would compose two rows and stop the
# client from opening -- the failure recorded twice on this project. Install one or the other, or both; they will not
# collide.
#
# It mounts by the package's own name. The row is `disabled: true` ON PURPOSE: the package installs whenever an
# operator adds it, and **the watchdog does not start answering permission requests until that toggle is turned on**.
# A permission answerer that activates because someone installed a package is a decision taken away from the person
# who has to live with it.
#
# Enable it in the plugin manager (flip the component on), or by removing `disabled: true` from this row in the
# profile's composed patch.
#
# ## Why `insert:` and not a bare `- id:`
#
# No earlier layer creates this row, so a bare `- id:` patch would be a *non-insert* patch targeting a nonexistent
# entry -- which the Loader **warns about and skips silently**. That failure shape is recorded in
# `@twinsearth/w2m-dsh-plugin`'s own patch file and in TROUBLESHOOTING 3.2: the package installs, the profile lists
# it, the client starts cleanly, and no row is ever composed.
## The two halves
#
# `index.mjs` is the watchdog (server). `lib/client.js` is the screenshot half (browser), declared by `dsh.client` in
# package.json. The row below gates the WATCHDOG. If the screenshot shortcut does not fire on an installed machine, the
# first thing to check is whether this row is composed at all: a `disabled: true` row is not composed, and an entry that is
# not composed has no browser half either. Enabling the row is what the plugin manager's toggle does, and it starts the
# watchdog too -- that trade-off is exactly why the row ships disabled.
- insert:
    - id: dsh-gpw2
      name: '@twinsearth/dsh-gpw2'
      disabled: true
      config:
        maxPerWindow: 10
        windowMs: 60000
        minGapMs: 3000
